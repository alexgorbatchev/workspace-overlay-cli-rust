[package]
name = "workspace-overlay"
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "MIT"
description = "Native layered workspace filesystems and recoverable Git worktree sessions"
publish = false

[dependencies]
cap-std = "4.0.3"
cap-fs-ext = "4.0.3"
fuser = { version = "0.18.0", path = "../../third_party/fuser" }
libc = "0.2.190"
notify = "8.2.0"
parking_lot = "0.12.5"
rustix = { version = "1.1.5", features = ["fs", "process", "event", "thread"] }
globset = "0.4.20"
path-clean = "1.0.1"
serde = { version = "1.0.228", features = ["derive"] }
thiserror = "2.0.17"
toml = "1.1.8"
lru = "0.18.5"
infer = "0.22.0"
pathdiff = "0.2.3"
serde_json = "1.0.154"
sha2 = "0.10.9"
dirs = "7"
getrandom = "0.4"
log = "0.4.34"

[dev-dependencies]
tempfile = "3.23.0"
